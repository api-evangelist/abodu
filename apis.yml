aid: abodu
name: Abodu
description: 'Abodu designs, manufactures, and installs prefabricated accessory dwelling
  units (ADUs) and backyard homes across California. It offers state-approved plans
  with fixed all-in pricing and installation as fast as one day, spanning seven models
  from the 385 sq ft Abodu Studio to the 1,195 sq ft Abodu Three+, plus an Abodu Office.
  The homes target homeowners seeking rental income, aging-in-place, home offices,
  and guest houses, as well as multifamily operators, and feature fire-resistant construction
  with an optional Net Zero solar package. Abodu is a Norwest Venture Partners portfolio
  company. It publishes no public developer API, portal, or documentation surface.'
